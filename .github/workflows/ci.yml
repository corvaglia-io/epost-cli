name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Compile synthetic tests
        run: cargo test --locked --offline --no-run
      - name: Test with loopback networking only
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc)"
          export RUSTDOC="$(rustup which rustdoc)"
          export CARGO_HOME="$HOME/.cargo"
          sudo --preserve-env=RUSTC,RUSTDOC,CARGO_HOME unshare --net sh -c \
            'ip link set lo up; exec "$1" test --locked --offline' sh "$(rustup which cargo)"
